services:
  - type: web
    name: cgi-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.7
    healthCheckPath: /
