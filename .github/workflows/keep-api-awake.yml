# Keeps the free-plan API from going to sleep: a request every 10 minutes, 06:00-23:00 Manila time (22:00-15:00 UTC).
# That is about 17 hours a day, under Render's 750 free hours a month. GitHub's timer can run a few minutes late.
# The API address lives in the repository secret RENDER_API_URL; nothing here prints it.
name: keep-api-awake
on:
  schedule:
    - cron: "*/10 22-23,0-15 * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the API root
        env:
          RENDER_API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          if [ -z "$RENDER_API_URL" ]; then echo "RENDER_API_URL secret is not set"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 100 --retry 1 "$RENDER_API_URL/") || code="no response"
          echo "API root answered: $code"
          case "$code" in 2*|3*) ;; *) exit 1 ;; esac
      # Warm the pages and public endpoints whose first request rebuilds a heavy cache on the API (themes, countries,
      # watchlists, freshness), so a rebuild lands here and not on a visitor, whose page would otherwise time out.
      # Only public URLs; a slow or failed warm-up never fails the run (the API keeps computing after a client gives up).
      - name: Warm the heavy caches
        timeout-minutes: 8
        run: |
          for path in / /countries /backtest /api/themes /api/watchlists /api/freshness; do
            out=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" --max-time 110 "https://cgi-vercel.vercel.app$path" || echo "timeout")
            echo "$path -> $out"
          done
